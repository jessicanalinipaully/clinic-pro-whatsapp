<!DOCTYPE html>
<html>
<head>
  <title>WhatsApp Clinic Chatbot</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e5ddd5;
      display: flex;
      justify-content: center;
      padding: 30px;
    }

    .phone {
      width: 420px;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 6px 25px rgba(0,0,0,0.2);
    }

    .header {
      background: #075e54;
      color: white;
      padding: 18px;
      font-size: 20px;
      font-weight: bold;
    }

    .chat {
      height: 560px;
      padding: 15px;
      overflow-y: auto;
      background: #ece5dd;
    }

    .msg {
      padding: 10px 14px;
      margin: 8px 0;
      border-radius: 10px;
      max-width: 80%;
      line-height: 1.4;
      white-space: pre-line;
    }

    .bot {
      background: white;
    }

    .user {
      background: #dcf8c6;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: #f0f0f0;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      border: 1px solid #ccc;
      outline: none;
    }

    button {
      margin-left: 8px;
      background: #25d366;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="phone">
    <div class="header">ABC Clinic WhatsApp Bot</div>

    <div class="chat" id="chat"></div>

    <div class="input-area">
      <input id="userInput" placeholder="Type message...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const API_URL = "http://127.0.0.1:5055";
    const PHONE_NUMBER = "8197517222";

    function addMessage(text, sender) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.className = "msg " + sender;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();

      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      const response = await fetch(`${API_URL}/chat`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          phone: PHONE_NUMBER,
          message: text
        })
      });

      const result = await response.json();
      addMessage(result.reply, "bot");
    }

    document.getElementById("userInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    addMessage("Hi 👋 Send any message to start booking.", "bot");
  </script>

</body>
</html>
