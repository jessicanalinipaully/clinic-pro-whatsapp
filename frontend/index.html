<!DOCTYPE html>
<html>
<head>
  <title>Clinic Appointment Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Clinic Admin Dashboard</h1>

  <div class="stats">
    <div class="stat-card">
      <h3>Total</h3>
      <p id="totalCount">0</p>
    </div>
    <div class="stat-card">
      <h3>Booked</h3>
      <p id="bookedCount">0</p>
    </div>
    <div class="stat-card">
      <h3>Confirmed</h3>
      <p id="confirmedCount">0</p>
    </div>
    <div class="stat-card">
      <h3>Completed</h3>
      <p id="completedCount">0</p>
    </div>
    <div class="stat-card">
      <h3>Cancelled</h3>
      <p id="cancelledCount">0</p>
    </div>
  </div>

  <div class="card">
    <h2>Doctor Management</h2>

    <input id="doctorName" placeholder="Doctor Name">
    <input id="specialization" placeholder="Specialization">

    <button onclick="addDoctor()">Add Doctor</button>

    <h3>Doctors List</h3>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Doctor</th>
          <th>Specialization</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="doctorsTable"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Manual Appointment Booking</h2>

    <input id="patientName" placeholder="Patient Name">
    <input id="phone" placeholder="WhatsApp Number">

    <select id="doctor"></select>

    <input id="date" type="date">
    <input id="time" type="time">

    <button onclick="bookAppointment()">Book Appointment</button>

    <p id="message"></p>
  </div>

  <div class="card">
    <h2>Appointments</h2>

    <div class="filters">
      <input id="searchInput" placeholder="Search by patient, phone, doctor..." onkeyup="applyFilters()">

      <select id="statusFilter" onchange="applyFilters()">
        <option value="all">All Status</option>
        <option value="booked">Booked</option>
        <option value="confirmed">Confirmed</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>

      <button onclick="loadAppointments()">Refresh</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Patient</th>
          <th>Phone</th>
          <th>Doctor</th>
          <th>Date</th>
          <th>Time</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="appointmentsTable"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
